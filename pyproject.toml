[project]
name = "misecre"
version = "0.1.0"
description = "Secretaria personal: capturá por voz o texto, agenda en Google Calendar, avisos y un agente de IA opcional"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Franco Funes" }]
keywords = ["telegram", "google-calendar", "whisper", "assistant", "self-hosted", "spanish"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: Spanish",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business :: Scheduling",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "python-telegram-bot>=21",
    "faster-whisper>=1.0",
    "av>=13,<17",   # av>=17 rompe faster-whisper (metadata_errors)
    "rapidfuzz>=3.9",
    "pyyaml>=6",
    "pydantic>=2.7",
    "python-dotenv>=1",
    "tzdata>=2024.1",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "anthropic>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
misecre = "misecre.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["misecre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
